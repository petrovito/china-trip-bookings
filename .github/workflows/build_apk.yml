name: Build Flutter APK

on:
  push:
    branches: [flutter-frontend]
    paths:
      - 'flutter/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    # Skip if this is the bootstrap commit adding platform files
    if: "!contains(github.event.head_commit.message, 'add flutter platform files')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-trip-${{ github.sha }}
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
