name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Check if platform files exist
        id: check
        run: |
          if [ -d "flutter/android" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate android/ and web/ platform files
        if: steps.check.outputs.needed == 'true'
        run: |
          flutter create /tmp/bootstrap \
            --project-name china_trip \
            --org com.petrovito \
            --platforms android,web \
            --description "China Trip Bookings"
          cp -r /tmp/bootstrap/android flutter/android
          cp -r /tmp/bootstrap/web     flutter/web

      - name: Patch AndroidManifest.xml
        if: steps.check.outputs.needed == 'true'
        run: |
          M="flutter/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$M"
          sed -i 's|</manifest>|    <queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="androidamap"/></intent>\n    </queries>\n</manifest>|' "$M"

      - name: Commit platform files
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flutter/android flutter/web
          git commit -m "chore: add flutter platform files [skip ci]"
          git push

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-trip-${{ github.sha }}
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
